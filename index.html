<body class="temp--on">
    <main class="d-flex">
        <div class="icons">

                        <div data-align="right" title="right" class="align-element">

                        </div>
                        <div data-align="bottom" title="bottom" class="align-element">

                            <img src="assets/images/right.png" alt="right align">
                            <p class="mb-0">Right Align</p>
                        </div>
                    </div>
                    <div class="border-radius row d-none">
                        <div class="col-md-6">
                            <div class="mb-3">
                                <input type="number" value="0" data-position="top" class="form-control" id="topradius">

                        </div>
                        <div class="col-md-6">

                            <div class="mb-3">
                                <input type="number" value="0" data-position="right" class="form-control"

                            </div>
                        </div>
                        <div class="col-md-6">

                            <div class="mb-3">
                                <input type="number" value="0" data-position="bottom" class="form-control"
                                    id="bottomradius">

                            </div>
                        </div>
                        <div class="col-md-6">

                            <div class="mb-3">
                                <input type="number" value="0" data-position="left" class="form-control"
                                    id="leftradius">

                            </div>
                        </div>
                    </div>


                    <div class="set-size d-none">
                        <div class="mb-3 d-flex align-items-center">
                            <label for="boxwidth" class="form-label mb-0">Width</label>
                            <input type="number" data-size="width" value="0" class="form-control" id="boxwidth">

                        <div class="mb-3 d-flex align-items-center">
                            <label for="boxheight" class="form-label mb-0">Height</label>
                            <input type="number" data-size="height" value="0" class="form-control" id="boxheight">

            <div class="icon icon__active">
                <div class="icon--button">
                    <img src="assets/images/box.png" alt="color" class="img-fluid">
                    <p class="mb-0 mt-2">Shapes</p>
                </div>
                <div class="icon--box active" data-options="color">
                    <div class="icon--colors">

                    </div>

                </div>
            </div>
            <div class="icon">
                <div class="icon--button laod_image">

                    <p class="mb-0 mt-2">Images</p>
                </div>
                <div class="icon--box" data-options="shape">
                    <div class="image--box">
                        <div class="icon--image w-100">


                        </div>
                    </div>
                    <button class="btn btn-primary mt-2 w-100 laodMoreImage">+ Load More</button>

                </div>
            </div>
            <div class="icon">
                <div class="icon--button">
                    <img src="assets/images/text.png" alt="color" class="img-fluid">
                    <p class="mb-0 mt-2">Text</p>
                </div>
                <div class="icon--box" data-options="text">
                    <div class="icon--text">

                        </div>
                    </div>
                </div>
            </div>
            <div class="icon">
                <div class="icon--button laod_icons">
                    <img src="assets/images/icons.png" alt="line" class="img-fluid">
                    <p class="mb-0 mt-2">Icons</p>
                </div>
                <div class="icon--box" data-options="line">
                    <div class="social-icons"></div>
                </div>
            </div>
            <div class="icon saveImage">
                <div class="icon--button">
                    <img src="assets/images/save.png" alt="save" class="img-fluid">
                    <p class="mb-0 mt-2">Save</p>
                </div>
            </div>

        <section class="section--container d-flex align-items-center">

                    </div>
                    <div class="section--container__content">

                        .a {
                            fill: none;
                            stroke: #000;

                    <input type="range" class="rangeSlider" min="1" value="1" step="0.2" max="4">
                    <div class="zoomLable">
                        <span>100</span>
                        <div class="dropdown position-absolute">
                            <div data-value="4">400</div>
                            <div data-value="3.5">350</div>
